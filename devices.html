<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen preview | Ive</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #2b2b2a; color: #eee; font: 13px/1.4 -apple-system, 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 18px; background: #161616; border-bottom: 1px solid #000; }
    header b { letter-spacing: .16em; text-transform: uppercase; font-size: 12px; margin-right: 6px; }
    select, button { font: inherit; color: #eee; background: #2b2b2a; border: 1px solid #555; padding: 6px 10px; cursor: pointer; }
    button.on { background: #eee; color: #111; border-color: #eee; }
    .group { display: flex; gap: 4px; flex-wrap: wrap; }
    .note { margin-left: auto; color: #999; }
    main { flex: 1; overflow: auto; display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 24px; }
    .device { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .device span { color: #aaa; font-size: 12px; }
    .frame { background: #fff; border: 10px solid #0d0d0d; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
    .frame iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
</style>
</head>
<body>

<header>
    <b>Ive — screen preview</b>
    <select id="page">
        <option value="index.html">Home</option>
        <option value="teaching.html">Teaching</option>
        <option value="events.html">Events</option>
        <option value="contact.html">Contact</option>
        <option value="terms.html">Terms</option>
        <option value="privacy.html">Privacy</option>
        <option value="cookies.html">Cookies</option>
        <option value="404.html">404</option>
    </select>
    <div class="group" id="devices"></div>
    <button id="rotate">Rotate</button>
    <span class="note">Each frame is a real browser window at that size — scroll inside it.</span>
</header>

<main id="stage"></main>

<script>
    var DEVICES = {
        all: null,
        'Small phone': [360, 740],
        'Phone': [390, 844],
        'Tablet': [768, 1024],
        'Tablet landscape': [1024, 768],
        'Laptop': [1440, 900]
    };
    var ALL = ['Phone', 'Tablet', 'Laptop'];
    var current = 'all', rotated = false;
    var stage = document.getElementById('stage');

    Object.keys(DEVICES).forEach(function (name) {
        var b = document.createElement('button');
        b.textContent = name === 'all' ? 'Phone + tablet + laptop' : name;
        b.onclick = function () { current = name; rotated = false; render(); };
        b.dataset.name = name;
        document.getElementById('devices').appendChild(b);
    });

    document.getElementById('page').onchange = render;
    document.getElementById('rotate').onclick = function () { rotated = !rotated; render(); };

    var resizeTimer;
    window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 100); });

    function sizesFor(names) {
        return names.map(function (n) { var s = DEVICES[n]; return rotated ? [s[1], s[0]] : s; });
    }

    /* builds the frames (only when the page, device or rotation changes) */
    function render() {
        document.querySelectorAll('#devices button').forEach(function (b) { b.classList.toggle('on', b.dataset.name === current); });
        var names = current === 'all' ? ALL : [current];
        var page = document.getElementById('page').value;
        stage.innerHTML = '';
        names.forEach(function (n, i) {
            var d = document.createElement('div');
            d.className = 'device';
            d.innerHTML = '<div class="frame"><iframe src="' + page + '"></iframe></div><span></span>';
            d.dataset.name = n;
            stage.appendChild(d);
        });
        layout();
    }

    /* scales the existing frames to fit the window, without reloading them */
    function layout() {
        var devices = [].slice.call(stage.querySelectorAll('.device'));
        var sizes = sizesFor(devices.map(function (d) { return d.dataset.name; }));
        var availW = stage.clientWidth - 48 - (devices.length - 1) * 28 - devices.length * 20;
        var availH = stage.clientHeight - 48 - 40;
        var totalW = sizes.reduce(function (a, s) { return a + s[0]; }, 0);
        var maxH = Math.max.apply(null, sizes.map(function (s) { return s[1]; }));
        var k = Math.min(1, availW / totalW, availH / maxH);

        devices.forEach(function (d, i) {
            var w = sizes[i][0], h = sizes[i][1];
            var frame = d.querySelector('.frame'), iframe = d.querySelector('iframe');
            frame.style.width = (w * k + 20) + 'px';
            frame.style.height = (h * k + 20) + 'px';
            iframe.style.width = w + 'px';
            iframe.style.height = h + 'px';
            iframe.style.transform = 'scale(' + k + ')';
            d.querySelector('span').textContent = d.dataset.name + ' · ' + w + ' × ' + h + (k < 1 ? ' · shown at ' + Math.round(k * 100) + '%' : '');
        });
    }

    render();
</script>
</body>
</html>
